[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securellmbench"
version = "0.1.0"
description = "A modular benchmark framework for evaluating the security of large language models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SecureLLMBench Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = []
semantic = [
    "sentence-transformers>=3,<4",
    "scikit-learn>=1.4,<2",
]
hdbscan = ["hdbscan>=0.8,<1"]
transformers = ["transformers>=4.40,<6", "torch>=2.2"]

[tool.setuptools.packages.find]
include = ["core*", "apps*"]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"
